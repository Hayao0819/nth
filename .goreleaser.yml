version: 2
project_name: nth
builds:
    - main: .
      binary: nth
      env:
        - CGO_ENABLED=0
      goos:
        - linux
        - darwin
        - windows
      goarch:
        - amd64
        - arm64
      flags:
        - -trimpath
      ldflags:
        - >-
          -s -w -X github.com/Hayao0819/nth/internal/version.Version={{.Version}}
archives:
    - formats:
        - binary
checksum:
    name_template: checksums.txt
changelog:
    use: github-native
